version: 2

# PRs target dev, like every other change - once merged there, CI runs on the push and the
# update reaches main through the usual dev -> main PR. Monthly and grouped so a small team
# gets one or two update PRs a month instead of one per package.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TS 7 breaks typescript-eslint and next build; lift once they support it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Must match the Node 24 runtime.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
