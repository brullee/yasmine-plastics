version: 2

# PRs target dev, like every other change - CI runs on the PR itself, and once merged the
# update reaches main through the usual dev -> main PR. Monthly and grouped so a small team
# gets one or two update PRs a month instead of one per package.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors are upgraded by hand: ESLint 10 and TS 7 both broke the build when bumped.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
