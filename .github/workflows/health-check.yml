name: Health check

# Daily ping of the live site. CI only proves a commit was fine when it was pushed - this
# catches what breaks later (Neon/Upstash outage, expired env var, a bad deploy) and the
# pages nobody visits day to day, like the admin login. Loading /admin/login also sends the
# Upstash database real traffic, so a quiet month can't get it archived as inactive.
# A failed run emails whoever last edited this schedule.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check live pages
        env:
          SITE: https://www.yasmineplastics.com
        run: |
          set -u
          failed=0

          # Record which deployment this run checked - informational, never fails the run.
          echo "live: $(curl -sS --max-time 30 "$SITE/api/version" || echo 'version unavailable')"

          # $1 path, remaining args: strings the HTML must contain
          check() {
            path=$1; shift
            # --retry covers a Neon cold start; --fail turns any 4xx/5xx into an error
            if ! body=$(curl -sSL --fail --retry 2 --retry-delay 10 --max-time 60 "$SITE$path"); then
              echo "::error::$path did not return a successful response"
              failed=1
              return
            fi
            missing=0
            for marker in "$@"; do
              if ! grep -qF "$marker" <<< "$body"; then
                echo "::error::$path is missing \"$marker\" - the page rendered without it"
                missing=1
              fi
            done
            if [ $missing -eq 0 ]; then echo "ok $path"; else failed=1; fi
          }

          check /             '<html'
          # Product data from Payload - only present when the database query succeeded.
          check /en/products  'categoryNameEn'
          # The login form itself is drawn client-side, so look for the server-rendered
          # brand block and the form's client reference instead - both are absent when
          # the login view crashes while rendering.
          check /admin/login  'login__brand' 'LoginViewForm'

          exit $failed
